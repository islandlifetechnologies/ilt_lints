include: package:ilt_lints/lints.yaml

plugins:
  ilt_lints:
    path: .
    diagnostics:
      export_library: true
      sort_fields: true
      sort_functions_alphabetically: true
      sort_functions_by_scope: true
      sort_named_parameters: true
      use_clock: true
      use_file_system: true
      valid_json_serializable: true
