---
$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: CustomLints
additionalProperties: false
required:
  - title
  - lints
properties:
  title:
    type: string
    description: The title to display on the rendered on the page for these lints.
  description:
    type: string
    description: The description of the lints the pages are built for.
  package:
    type: string
    description: The name of the package to place in the docs.
  version:
    type: string
    description: The version to recommend in the docs that users load.
  lints:
    type: array
    items:
      $ref: "#/$defs/CustomLint"

$defs:
  CustomLint:
    type: object
    required:
      - name
      - description
      - bad
      - good
      - enable

    properties:
      name:
        type: string
        example: valid_json_serializable
      description:
        type: string
        description: Detailed explanation of what the lint checks and why.
      tags:
        type: array
        description: >-
          Tags to apply to the lint.  It is recommended, but not required, to
          have at least one tag for each lint.
        items:
          type: string
      avoid:
        type: string
        example: A short one line statement explaining what the developer should be avoiding.
      do:
        type: string
        example: A short one line statement explaining what the developer should be doing.
      bad:
        type: array
        description: List of dart code snippets that trigger this lint.
        items:
          type: string
      good:
        type: array
        description: List of dart code snippets that should pass this lint.
        items:
          type: string
      quick_fix:
        type: boolean
        default: false
        description: Whether the custom lint has a quick fix. Defaults to false.
      enable:
        type: string
        description: Description of how to enable the lint via the `analysis_options.yaml` file.
