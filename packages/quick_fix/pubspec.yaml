  glob: ^2.2.0
  meta: ^1.19.0
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  analyzer_testing: ^0.4.5
  ilt_lints: ^2.0.0
  test: ^1.33.0
